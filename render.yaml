services:
  - type: web
    name: flowboard
    runtime: node
    plan: free
    healthCheckPath: /
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Add your OpenAI key in the Render dashboard to enable the AI assistant:
      # - key: OPENAI_API_KEY
      #   value: sk-...